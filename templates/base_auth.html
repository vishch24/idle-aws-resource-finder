<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Idle AWS Finder{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #06152e; --border: #244873; --amber: #ffc84a; --muted: #b9cce8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: Inter, sans-serif; color: #f5f8ff; background: radial-gradient(ellipse at top, #0d2850, var(--bg) 70%); }
    .auth-card   { width: 100%; max-width: 450px; padding: 38px; background: linear-gradient(145deg, #0d274c, #061832); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 20px 60px #0004; }
    .brand-icon  { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 18px; color: var(--amber); background: #ffc84a18; border: 1px solid #ffc84a50; border-radius: 16px; font-size: 32px; }
    .brand-title { font-size: 25px; font-weight: 800; text-align: center; letter-spacing: -1px; }
    .brand-title span { color: var(--amber); }
    .subtitle    { color: var(--muted); text-align: center; font-size: 13px; margin: 10px 0 30px; line-height: 1.6; }
    .form-label  { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .form-control { min-height: 47px; color: white; background: #06152e; border: 1px solid #315174; border-radius: 9px; font-size: 13px; }
    .form-control:focus { color: white; background: #06152e; border-color: var(--amber); box-shadow: 0 0 0 3px #ffc84a20; }
    .form-control::placeholder { color: #7186a5; }
    .form-check-label { color: var(--muted); font-size: 12px; }
    .form-check-input { background-color: #06152e; border-color: #526985; }
    .form-check-input:checked { background-color: #e6a923; border-color: #e6a923; }
    .btn-auth    { width: 100%; min-height: 47px; color: #101a2b; background: var(--amber); border: 0; border-radius: 9px; font-weight: 800; font-size: 14px; transition: .2s; }
    .btn-auth:hover { background: #ffda78; transform: translateY(-1px); }
    .divider     { display: flex; align-items: center; gap: 12px; color: #8fa5c4; font-size: 11px; margin: 23px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #244873; }
    .security-note { padding: 12px; border-radius: 9px; background: #102b45; color: #b9cce8; font-size: 11px; line-height: 1.6; }
    .security-note i { color: #5bd78b; margin-right: 5px; }
    .bottom-text { color: var(--muted); text-align: center; font-size: 12px; margin: 24px 0 0; }
    .auth-link   { color: var(--amber); font-weight: 700; text-decoration: none; }
    .auth-link:hover { text-decoration: underline; }
    @media (max-width: 480px) { .auth-card { padding: 28px 22px; } }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div style="position:fixed;top:12px;right:16px;z-index:9999;min-width:280px">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert" style="font-size:13px">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="auth-card">
    {% block card_content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
