name: Code Lint

on:
    workflow_call:

jobs:
    
    code-linter:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'   # same as the Dockerfile

            - name: Install Ruff
              run: pip install ruff

            - name: Code Lint
              run: ruff check .
